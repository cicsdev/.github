# Sample Copyright Checker
# 
# This action will scan files in the given directory with specific file extensions,
# it adds a copyright statement if none are present or updates it if necessary if,
# there have been changes after the current copyright statement year
# A Pull Request will be made with any changes to merge into the PR branch

name: Sample Copyright Checker

on:
  workflow_call:
    inputs:
      directory:
        description: 'Directory to search for copright statement'
        required: true
        default: './'
        type: string
      file-extensions:
        description: 'Comma-space separated string of file extensions to search for'
        required: true
        default: '*.java, *.js, *.jsp, *.cbl'
        type: string  
      base-copyright:
        description: 'Copyright statement to include if none exists'
        required: true
        default: 'Copyright IBM Corp. 2025'
        type: string  


jobs:
  check-copyright:
    name: Check Copyright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Copyright
        run: |
          DIRECTORY="${{ inputs.directory }}"
          EXTENSIONS="${{ inputs.file-extensions }}"
          BASE_COPYRIGHT="${{ inputs.base-copyright }}"

          for ext in "$EXTENSIONS"; do
              for file in $(find . -type f -name "$ext" -path "$DIRECTORY*"); do
                  echo "Processing file: $file"  
                  
                  LAST_MODIFIED_YEAR=$(git log --follow -1 --format="%ad" --date=format:"%Y" -- "$file")

                  if ! grep -q "Copyright" "$file"; then
                      echo -e "/**\n * $BASE_COPYRIGHT\n */\n$(cat "$file")" > "$file"
                  else
                      # Extract existing copyright line
                      CURRENT_COPYRIGHT=$(grep -o "Copyright IBM Corp. [0-9]\{4\}\(, [0-9]\{4\}\)\?" "$file")

                      ORIGINAL_YEAR=$(echo "$CURRENT_COPYRIGHT" | grep -o "[0-9]\{4\}" | head -1)
                  
                      # Check if LAST_MODIFIED_YEAR is anywhere in current copyright
                      if [[ "$CURRENT_COPYRIGHT" != *"$LAST_MODIFIED_YEAR"* ]]; then
                          # Check if copyright has two years
                          if [[ "$CURRENT_COPYRIGHT" =~ ,\ [0-9]{4}$ ]]; then
                              # If there is already a second year, replace it
                              sed -i "" "s/Copyright IBM Corp. $ORIGINAL_YEAR, [0-9]\{4\}/Copyright IBM Corp. $ORIGINAL_YEAR, $LAST_MODIFIED_YEAR/" "$file"
                          else
                              # If there is no second year, add it
                              sed -i "" "s/$CURRENT_COPYRIGHT/$CURRENT_COPYRIGHT, $LAST_MODIFIED_YEAR/" "$file"
                          fi
                      fi
                  fi
              done
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.head_ref }}      